<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffd66b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VocaRabbit" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>VocaRabbit</title>
  </head>
  <body>
    <div id="root"></div>
    <a href="https://www.cw2017.com" id="homeBtn" title="回家">&#8962;</a>
    <style>
      #homeBtn {
        position: fixed;
        top: 16px;
        right: max(42px, calc(50vw - 555px));
        left: auto;
        z-index: 150;
        width: 40px; height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 50%;
        color: #8f7a66;
        text-decoration: none;
        font-size: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      #homeBtn:hover { transform: scale(1.08); box-shadow: 0 3px 12px rgba(0,0,0,0.18); }
      body:has(.word-detail-drawer-backdrop) #homeBtn {
        pointer-events: none;
        opacity: 0.35;
      }
    </style>
    <script>
      (() => {
        const reloadKey = 'vocab-rabbit-cache-recovery';
        const assetPattern = /\/assets\/index-.*\.(js|css)$/;

        async function clearCachedShell() {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }

          if (!('caches' in window)) {
            return;
          }

          const cacheKeys = await caches.keys();
          await Promise.all(
            cacheKeys
              .filter((cacheKey) => cacheKey.startsWith('vocab-rabbit-shell'))
              .map((cacheKey) => caches.delete(cacheKey))
          );
        }

        window.addEventListener(
          'error',
          (event) => {
            const target = event.target;
            if (!(target instanceof HTMLScriptElement) && !(target instanceof HTMLLinkElement)) {
              return;
            }

            const assetUrl = target instanceof HTMLScriptElement ? target.src : target.href;
            if (!assetUrl || !assetPattern.test(assetUrl)) {
              return;
            }

            if (sessionStorage.getItem(reloadKey) === assetUrl) {
              return;
            }

            sessionStorage.setItem(reloadKey, assetUrl);
            void clearCachedShell().finally(() => {
              const reloadUrl = new URL(window.location.href);
              reloadUrl.searchParams.set('reload', Date.now().toString());
              window.location.replace(reloadUrl.toString());
            });
          },
          true
        );

        window.addEventListener(
          'load',
          () => {
            sessionStorage.removeItem(reloadKey);
          },
          { once: true }
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
